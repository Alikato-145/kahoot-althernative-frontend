# Temporary HTTP-only site used only to obtain the first Let's Encrypt
# certificate. Replace quiz.example.com, enable it, issue the certificate, then
# replace this file with camp-quiz.conf (which redirects HTTP to HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name quiz.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
