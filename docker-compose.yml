services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: camp_quiz
      MYSQL_USER: campquiz
      MYSQL_PASSWORD: campquiz
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -proot']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
